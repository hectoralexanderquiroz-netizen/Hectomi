<!-- Música de fondo de Hectomi -->
<video
  id="musicaTutu"
  src="tutu.mp4"
  loop
  playsinline
  preload="auto"
  style="display:none;"
></video>

<button id="botonMusica" aria-label="Activar música">
  🎵 Activar música
</button>

<style>
  #botonMusica {
    position: fixed;
    bottom: 18px;
    right: 14px;
    z-index: 9999;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 25px;
    background: rgba(35, 15, 45, .8);
    color: white;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
</style>

<script>
  const musica = document.getElementById("musicaTutu");
  const boton = document.getElementById("botonMusica");

  boton.addEventListener("click", async () => {
    try {
      if (musica.paused) {
        await musica.play();
        boton.textContent = "⏸️ Pausar música";
      } else {
        musica.pause();
        boton.textContent = "🎵 Reproducir música";
      }
    } catch (error) {
      boton.textContent = "🎵 Toca para reproducir";
    }
  });

  musica.addEventListener("play", () => {
    boton.textContent = "⏸️ Pausar música";
  });

  musica.addEventListener("pause", () => {
    boton.textContent = "🎵 Reproducir música";
  });
</script>
