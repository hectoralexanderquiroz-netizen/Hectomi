
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hectomi ❤️ Nuestro mundo</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#081323;color:white;font-family:Arial,sans-serif}
#world{position:fixed;inset:0}
.panel{background:#111a2be8;border:1px solid #ffffff30;border-radius:14px;padding:12px}
#brand{position:fixed;top:12px;left:12px;z-index:2;pointer-events:none}
#brand h1{margin:0;color:#ff9fc4;font-size:23px}
#help{position:fixed;top:12px;right:12px;width:190px;font-size:12px;line-height:1.7;z-index:2;pointer-events:none}
#buttons{position:fixed;bottom:12px;left:12px;display:flex;flex-wrap:wrap;gap:7px;z-index:3}
button{border:0;border-radius:10px;padding:10px 12px;background:#df568d;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#30405a}
#chat{position:fixed;right:12px;bottom:12px;width:min(300px,calc(100% - 24px));z-index:2}
#feed{font-size:12px;margin-top:8px;overflow-wrap:anywhere}
#chat form{display:flex;gap:5px;margin-top:8px}
#msg{width:100%;min-width:0;padding:9px;border-radius:8px;border:1px solid #ffffff40;background:#09111f;color:white}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;background:#111a2b;padding:16px;border-radius:12px;text-align:center;max-width:90%}
#modal{position:fixed;display:none;inset:0;background:#0009;z-index:10;align-items:center;justify-content:center;padding:16px}
#modal>div{max-width:400px;background:#171c30;border-radius:18px;padding:22px;text-align:center}
#modal p{line-height:1.5}
#modal button{margin:4px}
@media(max-width:650px){
 #brand h1{font-size:18px}
 #help{top:72px;width:145px;font-size:10px}
 #chat{bottom:78px;width:230px}
 #buttons{bottom:10px;left:10px;max-width:calc(100% - 20px)}
 #buttons button{font-size:11px;padding:9px}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="world"></div>

<header id="brand" class="panel">
  <h1>Hectomi ❤️</h1>
  <div>Nuestro mundo · Un lugar para compartir</div>
</header>

<div id="help" class="panel">
  <b>🎮 Controles</b><br>
  W A S D: caminar<br>
  Ratón: girar la cámara<br>
  Rueda: acercar o alejar<br>
  En celular: desliza para mirar
</div>

<div id="buttons">
  <button id="house">🏡 Casa</button>
  <button id="garden" class="secondary">🌹 Jardín</button>
  <button id="lake" class="secondary">🌙 Lago</button>
  <button id="bed" class="secondary">🛏️ Habitación</button>
  <button id="invite">💗 Invitar</button>
  <button id="stop" class="secondary">✋ Detener</button>
</div>

<div id="chat" class="panel">
  <b>💌 Mensaje</b>
  <div id="feed">Escribe un mensaje bonito.</div>
  <form id="chatForm">
    <input id="msg" maxlength="180" placeholder="Te quiero porque…" autocomplete="off">
    <button>Enviar</button>
  </form>
</div>

<div id="status">Preparando nuestro mundo…</div>

<div id="modal">
  <div>
    <h2 style="color:#ff9fc4">💗 Una invitación</h2>
    <p id="modalText">¿Quieres compartir un momento romántico conmigo?</p>
    <button id="accept">❤️ Aceptar</button>
    <button id="decline" class="secondary">Ahora no</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const status = $('status');

try {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x081323);
  scene.fog = new THREE.Fog(0x081323, 35, 110);

  const camera = new THREE.PerspectiveCamera(
    65, innerWidth / innerHeight, 0.1, 250
  );
  camera.position.set(0, 5, 10);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  $('world').appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 1, 0);
  controls.minDistance = 3;
  controls.maxDistance = 22;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.enablePan = false;

  scene.add(new THREE.HemisphereLight(0xc8ddff, 0x26351f, 2));

  const moon = new THREE.DirectionalLight(0xffd8e9, 2);
  moon.position.set(-8, 15, 8);
  moon.castShadow = true;
  scene.add(moon);

  const mat = color => new THREE.MeshStandardMaterial({color});

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200), mat(0x17402e)
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Caminos
  function path(x,z,w,d) {
    const p = new THREE.Mesh(
      new THREE.PlaneGeometry(w,d), mat(0x78604e)
    );
    p.rotation.x = -Math.PI/2;
    p.position.set(x,0.025,z);
    scene.add(p);
  }
  path(0,-12,4,50);
  path(12,-23,3,24);

  // Lago
  const water = new THREE.Mesh(
    new THREE.CircleGeometry(7,48),
    new THREE.MeshStandardMaterial({
      color:0x17627a,roughness:.25,metalness:.2
    })
  );
  water.rotation.x=-Math.PI/2;
  water.position.set(12,.04,-31);
  scene.add(water);

  // Casa
  const house = new THREE.Group();

  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(7,3.4,5),mat(0xe5cdbf)
  );
  walls.position.y=1.7;
  house.add(walls);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(5.5,2.5,4),mat(0x682b48)
  );
  roof.position.y=4.4;
  roof.rotation.y=Math.PI/4;
  house.add(roof);

  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1.1,2.2,.15),mat(0x54352c)
  );
  door.position.set(0,1.1,2.55);
  house.add(door);

  for (const x of [-2,2]) {
    const windowMesh = new THREE.Mesh(
      new THREE.BoxGeometry(1,1,.12),
      new THREE.MeshBasicMaterial({color:0xffd78a})
    );
    windowMesh.position.set(x,2,2.57);
    house.add(windowMesh);
  }
  house.position.set(0,0,-14);
  scene.add(house);

  // Habitación con cama
  const room = new THREE.Group();
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(8,.2,7),mat(0x694653)
  );
  floor.position.y=.1;
  room.add(floor);

  const bedBase = new THREE.Mesh(
    new THREE.BoxGeometry(3.2,.45,4.2),mat(0x583348)
  );
  bedBase.position.set(0,.42,0);
  room.add(bedBase);

  const mattress = new THREE.Mesh(
    new THREE.BoxGeometry(3.05,.3,4.05),mat(0xf4dce7)
  );
  mattress.position.set(0,.8,0);
  room.add(mattress);

  const headboard = new THREE.Mesh(
    new THREE.BoxGeometry(3.3,1.3,.2),mat(0x573047)
  );
  headboard.position.set(0,1,-2.05);
  room.add(headboard);

  for (const x of [-.8,.8]) {
    const pillow = new THREE.Mesh(
      new THREE.BoxGeometry(1,.15,.65),mat(0xffffff)
    );
    pillow.position.set(x,1,-1.4);
    room.add(pillow);
  }
  room.position.set(24,0,-13);
  scene.add(room);

  // Árboles
  function tree(x,z,s=1) {
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(.14*s,.23*s,1.8*s,8),
      mat(0x583b2b)
    );
    trunk.position.set(x,.9*s,z);
    scene.add(trunk);

    for (let i=0;i<3;i++) {
      const crown = new THREE.Mesh(
        new THREE.IcosahedronGeometry((.9-i*.1)*s,1),
        mat(i===1?0x245b41:0x2c704b)
      );
      crown.position.set(x,(1.9+i*.45)*s,z);
      scene.add(crown);
    }
  }

  for (let i=0;i<65;i++) {
    const x=(6+Math.random()*16)*(Math.random()<.5?-1:1);
    const z=12-Math.random()*80;
    tree(x,z,.7+Math.random()*.6);
  }

  // Luces y corazones
  for (let i=0;i<22;i++) {
    const light=new THREE.PointLight(0xff9ec8,1.6,5);
    light.position.set(i%2?3:-3,1,8-i*2.8);
    scene.add(light);
  }

  const hearts=[];
  for (let i=0;i<20;i++) {
    const h=new THREE.Mesh(
      new THREE.SphereGeometry(.12,10,8),
      new THREE.MeshBasicMaterial({color:0xff679d})
    );
    h.position.set((Math.random()-.5)*20,1+Math.random()*5,-Math.random()*40);
    scene.add(h);
    hearts.push(h);
  }

  // Personaje provisional para probar el mundo
  const player=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.34,.75,5,10),mat(0x472b45)
  );
  body.position.y=1.1;
  player.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.26,18,14),mat(0xe8b89a)
  );
  head.position.y=1.9;
  player.add(head);

  const hair=new THREE.Mesh(
    new THREE.SphereGeometry(.28,16,12),mat(0x30201e)
  );
  hair.scale.y=.7;
  hair.position.y=2.04;
  player.add(hair);

  const legs=[];
  for (const x of [-.15,.15]) {
    const leg=new THREE.Mesh(
      new THREE.CapsuleGeometry(.11,.55,4,8),mat(0x263149)
    );
    leg.position.set(x,.38,0);
    player.add(leg);
    legs.push(leg);
  }
  player.position.set(0,0,5);
  scene.add(player);

  const keys={};
  addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true;
  });
  addEventListener('keyup',e=>{
    keys[e.key.toLowerCase()]=false;
  });

  let last=performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt=Math.min((now-last)/1000,.05);
    last=now;

    const forward=new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y=0;
    forward.normalize();

    const right=new THREE.Vector3(forward.z,0,-forward.x);
    const move=new THREE.Vector3();

    if(keys.w||keys.arrowup) move.add(forward);
    if(keys.s||keys.arrowdown) move.sub(forward);
    if(keys.d||keys.arrowright) move.add(right);
    if(keys.a||keys.arrowleft) move.sub(right);

    if(move.lengthSq()>0) {
      move.normalize();
      player.position.addScaledVector(move,dt*4);
      player.rotation.y=Math.atan2(move.x,move.z);
      controls.target.addScaledVector(move,dt*4);
      legs.forEach((leg,i)=>{
        leg.rotation.x=Math.sin(now*.012+i*Math.PI)*.5;
      });
    } else {
      legs.forEach(leg=>leg.rotation.x*=.8);
    }

    hearts.forEach((h,i)=>{
      h.position.y+=Math.sin(now*.001+i)*dt*.1;
      h.rotation.y+=dt*.5;
    });

    controls.update();
    renderer.render(scene,camera);
  }

  requestAnimationFrame(animate);

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  function teleport(x,z,tx,tz) {
    player.position.set(x,0,z);
    controls.target.set(tx,1,tz);
  }

  $('house').onclick=()=>teleport(0,0,0,-14);
  $('garden').onclick=()=>teleport(0,0,0,0);
  $('lake').onclick=()=>teleport(12,0,12,-31);
  $('bed').onclick=()=>teleport(24,0,24,-13);

  $('chatForm').onsubmit=e=>{
    e.preventDefault();
    const input=$('msg');
    if(!input.value.trim()) return;
    $('feed').textContent='Tú: '+input.value.trim();
    input.value='';
  };

  $('invite').onclick=()=>{
    $('modal').style.display='flex';
    $('modalText').textContent=
      '¿Quieres compartir un momento romántico? En esta demo, la invitación no se envía a otro dispositivo.';
  };

  $('accept').onclick=()=>{
    $('modal').style.display='none';
    $('feed').textContent='❤️ Invitación aceptada en esta demostración.';
  };

  $('decline').onclick=()=>{
    $('modal').style.display='none';
    $('feed').textContent='No pasa nada. Podemos seguir explorando ❤️';
  };

  $('stop').onclick=()=>{
    $('modal').style.display='none';
    $('feed').textContent='Interacción detenida. ❤️';
  };

  status.textContent='¡Nuestro mundo está listo! ❤️';
  setTimeout(()=>status.style.display='none',2500);

} catch (error) {
  console.error('Error cargando Hectomi:',error);
  status.textContent='No se pudo cargar el mundo. Abre F12 → Console y comparte el error rojo.';
}
</script>
</body>
</html>
