```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hectomi ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #160b18, #4a1028);
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(360px, 85%);
      padding: 28px;
      text-align: center;
      background: #24151f;
      border: 1px solid #ff668b;
      border-radius: 20px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      border: 0;
      font-size: 16px;
    }

    button {
      background: #ff668b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #mensaje {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hectomi ❤️</h1>
    <p>Entra a nuestro mundo</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Tu correo electrónico"
        autocomplete="username" required>

      <input id="password" type="password" placeholder="Tu contraseña"
        autocomplete="current-password" required>

      <button id="entrar" type="submit">Entrar</button>
    </form>

    <p id="mensaje" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDW96MUsBSTY2M0iNlmB0SxbA209dia8u4",
      authDomain: "hectomi.firebaseapp.com",
      projectId: "hectomi",
      storageBucket: "hectomi.firebasestorage.app",
      messagingSenderId: "622508139794",
      appId: "1:622508139794:web:4b6843ba819c4c7234bfcb"
    };

    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("entrar");

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      document.getElementById("loginForm").addEventListener(
        "submit",
        async (evento) => {
          evento.preventDefault();
          boton.disabled = true;
          mensaje.textContent = "Comprobando acceso...";

          try {
            const email =
              document.getElementById("email").value.trim();
            const password =
              document.getElementById("password").value;

            await signInWithEmailAndPassword(auth, email, password);

            mensaje.textContent =
              "¡Inicio de sesión correcto! Firebase funciona.";
          } catch (error) {
            console.error("Error de Firebase:", error.code, error.message);
            mensaje.textContent =
              "Error: " + (error.code || error.message);
          } finally {
            boton.disabled = false;
          }
        }
      );
    } catch (error) {
      console.error(error);
      mensaje.textContent =
        "No se pudo iniciar Firebase. Revisa la configuración.";
    }
  </script>
</body>
</html>
